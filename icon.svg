<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8c7fa"/>
      <stop offset="50%" stop-color="#7cacf8"/>
      <stop offset="100%" stop-color="#c2e7ff"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8ab4f8"/>
    </linearGradient>
  </defs>
  
  <!-- App Icon Background (Squircle for Android) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="80" fill="none" stroke="url(#orbitGrad)" stroke-width="12" transform="rotate(-25 256 256)" opacity="0.85"/>
  
  <!-- Orbiting Node -->
  <circle cx="390" cy="190" r="18" fill="#d3e3fd"/>
  
  <!-- Inner Planetary Core -->
  <circle cx="256" cy="256" r="64" fill="url(#coreGrad)"/>
  
  <!-- Gemini / AG Sparkle Accent -->
  <path d="M 256 120 Q 256 160 216 160 Q 256 160 256 200 Q 256 160 296 160 Q 256 160 256 120 Z" fill="#7dacfc"/>
</svg>
